<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokéManager</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#DC2626', dark: '#B91C1C' },
            navy:    '#1E293B'
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-gray-50 text-navy font-sans min-h-screen antialiased">

  <!-- HEADER (desktop) -->
  <header id="topbar" class="hidden md:flex sticky top-0 z-40 bg-white border-b border-gray-200 h-16 items-center px-6 gap-6">
    <a href="#/pokedex" class="flex items-center gap-2 shrink-0">
      <span class="poke-ball" aria-hidden="true"></span>
      <span class="font-extrabold text-xl tracking-tight">
        Poké<span class="text-primary">Manager</span>
      </span>
    </a>

    <div class="flex-1 max-w-md mx-auto relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
      <input id="global-search" type="search" placeholder="Buscar Pokémon por nombre..."
             class="w-full pl-9 pr-3 py-2 rounded-lg bg-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" />
    </div>

    <nav class="flex items-center gap-1 shrink-0">
      <a href="#/pokedex"   data-nav="pokedex"   class="nav-link">Pokédex</a>
      <a href="#/teams"     data-nav="teams"     class="nav-link">Mis Equipos</a>
      <a href="#/favorites" data-nav="favorites" class="nav-link relative">
        Favoritos
        <span id="fav-badge" class="hidden absolute -top-1 -right-2 bg-primary text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
      <button id="user-menu" class="ml-2 w-9 h-9 rounded-full bg-navy text-white font-bold flex items-center justify-center hover:opacity-90">
        <i class="fa-solid fa-user text-sm"></i>
      </button>
    </nav>
  </header>

  <!-- MAIN -->
  <main id="app" class="max-w-7xl mx-auto px-4 md:px-6 py-6 pb-24 md:pb-10"></main>

  <!-- BOTTOM NAV (mobile) -->
  <nav id="mobile-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-gray-200 flex">
    <a href="#/pokedex"   data-nav="pokedex"   class="mobile-nav-item">
      <i class="fa-solid fa-book"></i><span>Pokédex</span>
    </a>
    <a href="#/teams"     data-nav="teams"     class="mobile-nav-item">
      <i class="fa-solid fa-users"></i><span>Equipos</span>
    </a>
    <a href="#/favorites" data-nav="favorites" class="mobile-nav-item relative">
      <i class="fa-solid fa-heart"></i><span>Favoritos</span>
      <span id="fav-badge-m" class="hidden absolute top-1 right-1/4 bg-primary text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
    </a>
  </nav>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-xl shadow-lg text-white text-sm font-medium"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/components/login.js"></script>
  <script src="assets/js/components/pokedex.js"></script>
  <script src="assets/js/components/favorites.js"></script>
  <script src="assets/js/components/teams.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
